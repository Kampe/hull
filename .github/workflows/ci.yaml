name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Helm lint
        run: helm lint chart/

  # The values matrix is discovered rather than listed: a hardcoded list means
  # a new chart/ci/*.yaml is silently untested until someone remembers to edit
  # this file, which is how coverage quietly rots.
  discover-values:
    runs-on: ubuntu-latest
    outputs:
      values: ${{ steps.find.outputs.values }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          list=$(ls chart/ci/*.yaml | xargs -n1 basename | jq -R . | jq -sc .)
          echo "values=$list" >> "$GITHUB_OUTPUT"
          echo "Discovered: $list"

  template-test:
    needs: discover-values
    runs-on: ubuntu-latest
    strategy:
      matrix:
        values: ${{ fromJSON(needs.discover-values.outputs.values) }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: "Template: ${{ matrix.values }}"
        run: helm template test chart/ -f "chart/ci/${{ matrix.values }}"

  # helm lint and helm template only prove the chart produces YAML. kubeconform
  # checks that YAML against real Kubernetes API schemas, which is what catches
  # a manifest that renders fine and is rejected at apply time.
  kubeconform:
    needs: discover-values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/
      - name: Validate rendered manifests
        run: |
          rc=0
          for f in chart/ci/*.yaml; do
            echo "── $(basename "$f")"
            helm template test chart/ -f "$f" \
              | kubeconform -strict -summary \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -ignore-missing-schemas || rc=1
          done
          exit $rc

  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Run test suite
        run: bash tests/test_chart.sh

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, template-test, test-suite]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract chart version
        id: version
        run: |
          VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package chart
        run: helm package chart/
      - name: Push to GHCR
        run: helm push "hull-${{ steps.version.outputs.version }}.tgz" oci://ghcr.io/kampe
