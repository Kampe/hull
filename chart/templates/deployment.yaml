{{- $fullname := include "hull.fullname" . -}}
{{- $labels := include "hull.labels" . -}}
{{- $selectorLabels := include "hull.selectorLabels" . -}}
{{- $kind := .Values.workloadType | default "Deployment" -}}
{{- $batch := has $kind (list "Job" "CronJob") -}}
{{- $job := .Values.job | default dict -}}
{{- $cron := .Values.cronJob | default dict -}}
{{- range $name, $vol := .Values.persistence }}
{{- if and (eq ($vol.type | default "pvc") "volumeClaimTemplate") (ne $kind "StatefulSet") }}
{{- fail (printf "persistence.%s.type=volumeClaimTemplate requires workloadType=StatefulSet" $name) }}
{{- end }}
{{- end }}
{{- if and (eq $kind "CronJob") (not $cron.schedule) }}
{{- fail "workloadType=CronJob requires cronJob.schedule (for example \"0 3 * * *\")" }}
{{- end }}
apiVersion: {{ ternary "batch/v1" "apps/v1" $batch }}
kind: {{ $kind }}
metadata:
  name: {{ $fullname }}
  labels:
    {{- $labels | nindent 4 }}
spec:
{{- if eq $kind "CronJob" }}
  schedule: {{ $cron.schedule | quote }}
  {{- with $cron.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- with $cron.concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- if not (kindIs "invalid" $cron.startingDeadlineSeconds) }}
  startingDeadlineSeconds: {{ $cron.startingDeadlineSeconds }}
  {{- end }}
  {{- if not (kindIs "invalid" $cron.successfulJobsHistoryLimit) }}
  successfulJobsHistoryLimit: {{ $cron.successfulJobsHistoryLimit }}
  {{- end }}
  {{- if not (kindIs "invalid" $cron.failedJobsHistoryLimit) }}
  failedJobsHistoryLimit: {{ $cron.failedJobsHistoryLimit }}
  {{- end }}
  {{- if not (kindIs "invalid" $cron.suspend) }}
  suspend: {{ $cron.suspend }}
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
    spec:
      {{- include "hull.jobSpecFields" . | nindent 6 }}
      {{- include "hull.podTemplate" . | nindent 6 }}
{{- else if eq $kind "Job" }}
  {{- include "hull.jobSpecFields" . | nindent 2 }}
  {{- include "hull.podTemplate" . | nindent 2 }}
{{- else }}
  {{- /* DaemonSet has no replicas: one pod per node is the whole point. */}}
  {{- if ne $kind "DaemonSet" }}
  replicas: {{- if not (kindIs "invalid" .Values.replicas) }} {{ .Values.replicas }}{{- else }} 1{{- end }}
  {{- end }}
  {{- if .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  {{- if eq $kind "StatefulSet" }}
  serviceName: {{ $fullname }}
  {{- end }}
  {{- with .Values.strategy }}
  {{- if eq $kind "Deployment" }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
  {{- include "hull.podTemplate" . | nindent 2 }}
  {{- if and (eq $kind "StatefulSet") .Values.persistence }}
  {{- $claimTemplates := include "hull.volumeClaimTemplates" (dict "persistence" .Values.persistence "labels" $labels) | trim }}
  {{- if $claimTemplates }}
  volumeClaimTemplates:
    {{- $claimTemplates | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
